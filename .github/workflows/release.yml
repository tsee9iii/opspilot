name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: agent
            goarch: amd64
            asset: opspilot-agent-linux-amd64
          - target: agent
            goarch: arm64
            asset: opspilot-agent-linux-arm64
          - target: central
            goarch: amd64
            asset: opspilot-central-linux-amd64
          - target: central
            goarch: arm64
            asset: opspilot-central-linux-arm64

    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.asset }}" "./cmd/${{ matrix.target }}"

      - name: Verify binary
        run: |
          test -x "dist/${{ matrix.asset }}"
          test -s "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or reuse release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
