central_url: http://localhost:8080
registration_token: ""
secret: ""
version: "0.1.0"
server:
  hostname: ""
  environment: ""
agent_id: ""
poll_interval: 5
execution_policy:
  enabled: true
  timeout: 30s
  allowed_commands: []
  denied_commands: []
  working_directory: ""

# Optional project profiles (configuration and discovery only — no tool is
# executed from here). Each project needs a unique name, an absolute repository
# path, and "restart" and "logs" tool references; health_url is optional.
# projects:
