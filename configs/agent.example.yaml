central_url: http://localhost:8080
registration_token: ""
secret: ""
version: "0.1.0"
server:
  hostname: ""
  environment: ""
agent_id: ""
# signing_key is issued by central during registration and persisted here so
# the agent can HMAC-sign subsequent requests.
signing_key: ""
# sse_enabled defaults to true. When enabled, the agent keeps a signed SSE
# wake-up stream open to central (/api/v1/agents/events) and polls immediately
# whenever central signals a new leasable command, so interactive Milo/Hermes
# commands start in ~one round trip instead of waiting for a poll tick. The SSE
# stream carries only a "wake up and lease" notice — never command payloads,
# secrets or results.
sse_enabled: true
# poll_interval (seconds) is the FALLBACK command-poll interval. With SSE
# enabled (default) it is a recovery mechanism for disconnections and startup,
# so 30s is a good conservative default for personal use. If you disable SSE,
# lower it (e.g. 2-5s) because polling becomes the only delivery path.
poll_interval: 30
# health_report_interval is how often the agent gathers CPU/memory/disk metrics
# (and probes configured project health URLs) and reports them to central in
# seconds. Zero disables the health report loop.
health_report_interval: 60
execution_policy:
  enabled: true
  timeout: 30s
  allowed_commands: []
  denied_commands: []
  working_directory: ""

# allow_insecure_central permits an http:// central_url when the agent reports
# a production environment. Keep it false in production: the agent must talk to
# central over TLS so tokens are never sent in the clear. Set it to true only
# for local development behind a TLS-terminating proxy.
allow_insecure_central: false

# filesystem controls the read-only file tools (file.read, filesystem.list).
# By default they only accept paths relative to a configured project root and
# absolute paths are denied (fail closed). Enable allow_absolute_paths ONLY if
# every tool caller is trusted; the Hermes integration must not be reachable by
# untrusted parties.
filesystem:
  allow_absolute_paths: false

# http_check restricts where the http.check tool may connect. Restricted ranges
# (loopback, link-local incl. cloud metadata, RFC1918 private, CGNAT) are
# denied by default. Configuring any allowlist restricts the tool to exactly
# those destinations; allow_private opts back into private ranges.
http_check:
  allow_endpoints: []
  allow_hosts: []
  allow_cidrs: []
  allow_private: false

# Optional project profiles (configuration and discovery only — no tool is
# executed from here). Each project needs a unique name and an absolute path.
# A project deploys either with a legacy "restart"/"logs" tool pair (git.pull
# + restart + health) or with a deploy strategy selected by deploy.type
# (docker-compose, pm2, or script); health.url is optional.
