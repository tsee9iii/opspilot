central_url: http://localhost:8080
registration_token: ""
secret: ""
version: "0.1.0"
server:
  hostname: ""
  environment: ""
agent_id: ""
# signing_key is issued by central during registration and persisted here so
# the agent can HMAC-sign subsequent requests.
signing_key: ""
poll_interval: 5
execution_policy:
  enabled: true
  timeout: 30s
  allowed_commands: []
  denied_commands: []
  working_directory: ""

